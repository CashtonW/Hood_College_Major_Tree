            document.getElementById('plannerOverlay').style.display = 'flex';
        }

        function closeManualPlanner() {
            document.getElementById('plannerOverlay').style.display = 'none';
        }

        function addCourseToManualPlan(courseKey) {
            if (manualPlan.some(term => term.includes(courseKey))) return;
            let target = selectedPlanSlot ? selectedPlanSlot.split('-').map(Number) : null;
            if (!target || manualPlan[target[0]][target[1]]) {
                target = null;
                manualPlan.some((term, termIndex) => term.some((course, slotIndex) => {
                    if (course || target) return false;
                    target = [termIndex, slotIndex];
                    return true;
                }));
            }
            if (!target) return;
            manualPlan[target[0]][target[1]] = courseKey;
            selectedPlanSlot = `${target[0]}-${target[1]}`;
            renderManualPlan();
            renderPlannerSearch();
        }

        function getPlanningStartTerm() {
            const term = getUpcomingAcademicTerm();
            return term.semester === 'Summer' ? { semester: 'Fall', year: term.year } : term;
        }

        function getPlanningStartYear(startingSemester) {
            const currentTerm = getCurrentTermInfo();
            // Selecting Spring during a Fall term means the next calendar year's Spring.
            return startingSemester === 'Spring' && currentTerm.semester === 'Fall'
                ? currentTerm.year + 1
                : currentTerm.year;
        }

        function getNextAcademicTerm(term) {
            return term.semester === 'Fall'
                ? { semester: 'Spring', year: term.year + 1, parity: ((term.year + 1) % 2 === 0) ? 'Even' : 'Odd' }
                : { semester: 'Fall', year: term.year, parity: (term.year % 2 === 0) ? 'Even' : 'Odd' };
        }

        function isCourseAvailableForPlan(meta, term) {
            const availability = meta.availability || [];
            if (availability.length === 0) return true;
            return availability.some(entry => {
                const parsed = parseAvailabilityEntry(entry);
                return (!parsed.semester || parsed.semester === term.semester) &&
                    (!parsed.parity || parsed.parity === term.parity);
            });
        }

        function buildDegreePlan() {
            const coursesPerTerm = Number(document.getElementById('coursesPerTerm').value);
            const planSemesters = Number(document.getElementById('planSemesters').value);
            const startingSemester = document.getElementById('planStartSemester').value;
            const results = document.getElementById('degreePlanResults');
            const remaining = Object.keys(currentCourseMeta).filter(id => !completedNodesTracker.has(id));
            const plannedOrCompleted = new Set(completedNodesTracker);
            const terms = [];
            let term = { semester: startingSemester, year: getPlanningStartYear(startingSemester) };
            term.parity = (term.year % 2 === 0) ? 'Even' : 'Odd';
            const maximumTerms = planSemesters;

            for (let termIndex = 0; termIndex < maximumTerms && remaining.length > 0; termIndex++) {
                const eligible = remaining.filter(courseKey => {
                    const prerequisites = currentDependencyMap[courseKey] || [];
                    return prerequisites.every(prerequisite => plannedOrCompleted.has(prerequisite)) &&
                        isCourseAvailableForPlan(currentCourseMeta[courseKey] || {}, term);
                });

                eligible.sort((a, b) => {
                    const aRare = (currentCourseMeta[a]?.availability || []).some(entry => /Even|Odd/i.test(entry));
                    const bRare = (currentCourseMeta[b]?.availability || []).some(entry => /Even|Odd/i.test(entry));
                    return Number(bRare) - Number(aRare) || a.localeCompare(b);
                });

                const scheduled = eligible.slice(0, coursesPerTerm);
                if (scheduled.length > 0) {
                    scheduled.forEach(courseKey => {
                        plannedOrCompleted.add(courseKey);
                        remaining.splice(remaining.indexOf(courseKey), 1);
                    });
                    terms.push({ term: { ...term }, courses: scheduled });
                }
                term = getNextAcademicTerm(term);
            }

            if (terms.length === 0) {
                results.innerHTML = '<p class="degree-plan-note">No remaining courses can be scheduled with the currently available prerequisite information.</p>';
                return;
            }

            const termCards = terms.map(item => `
                <section class="degree-plan-term">
                    <h4>${item.term.semester} ${item.term.year}</h4>
                    <p>${item.courses.length} planned ${item.courses.length === 1 ? 'class' : 'classes'}</p>
                    <ul>${item.courses.map(courseKey => `<li><strong>${formatCourseLabel(courseKey)}</strong><span>${(currentCourseMeta[courseKey] || {}).name || 'Course requirement'}</span></li>`).join('')}</ul>
                </section>
            `).join('');
            const unscheduled = remaining.length
                ? `<p class="degree-plan-note">${remaining.length} course${remaining.length === 1 ? '' : 's'} did not fit within your selected ${planSemesters}-semester plan, or could not be scheduled because prerequisite or availability information is incomplete.</p>`
                : `<p class="degree-plan-note">This ${planSemesters}-semester plan includes every remaining course shown in your dependency tree.</p>`;
            results.innerHTML = `<h3>Your suggested plan</h3>${termCards}${unscheduled}`;
        }

        // =================================================================
        // LAYOUT ENGINE: Measures the real height of the fixed header + controls panel
        // (which can wrap onto multiple lines on narrow/mobile screens, or when many
        // controls such as search + transcript upload + clear-all are visible at once)
        // and pushes the graph viewport down by exactly that amount, instead of relying
        // on a hardcoded pixel offset that breaks whenever the panel wraps.
        // =================================================================
        function syncAppLayoutOffset() {
            const header = document.querySelector('.hood-header');
            const controls = document.querySelector('.controls-panel');
            const appLayout = document.querySelector('.app-layout');
            if (!header || !controls || !appLayout) return;

            const headerHeight = header.offsetHeight;
            const controlsBottom = controls.getBoundingClientRect().bottom;
            const totalOffset = Math.max(headerHeight, controlsBottom) + 12;

            appLayout.style.paddingTop = `${totalOffset}px`;
            controls.style.top = `${headerHeight + 10}px`;
        }

        window.addEventListener('load', syncAppLayoutOffset);
        window.addEventListener('resize', syncAppLayoutOffset);
        if (window.ResizeObserver) {
            const layoutObserver = new ResizeObserver(syncAppLayoutOffset);
            layoutObserver.observe(document.querySelector('.controls-panel'));
            layoutObserver.observe(document.querySelector('.hood-header'));
        }

        // =================================================================
        // ZOOM ENGINE: Lets users scale large / cluttered dependency trees up or down,
        // independent of the browser's own page zoom, so text stays legible whether
        // a major has 5 courses or 25+.
        // =================================================================
        let currentGraphZoom = 1;
        const ZOOM_MIN = 0.2, ZOOM_MAX = 2.5, ZOOM_STEP = 0.15;

        function applyGraphZoom() {
            const wrapper = document.getElementById('graph-zoom-wrapper');
            // CSS zoom changes the element's layout footprint as well as its appearance.
            // A transform only changed the appearance, leaving an oversized invisible
            // scroll area behind and making the chart appear cut off after resizing.
            if (wrapper) wrapper.style.zoom = String(currentGraphZoom);
            const label = document.getElementById('zoomLevelLabel');
            if (label) label.textContent = `${Math.round(currentGraphZoom * 100)}%`;
        }

        function resetGraphZoom() {
            currentGraphZoom = 1;
            applyGraphZoom();
        }

        // Reads the graph's natural (unscaled) rendered size and the viewport's usable
        // area. Shared by both fit strategies below so they measure the same way.
        // Returns null if either element is missing or has no measurable size.
        function measureGraphAndViewport() {
            const wrapper = document.getElementById('graph-zoom-wrapper');
            const graph = document.getElementById('graph-container');
            const viewport = document.getElementById('viewport');
            if (!wrapper || !graph || !viewport) return null;

            // Read the graph's unscaled dimensions from its current rendered bounds.
            // Do not reset `zoom` here: resetting an SVG foreignObject while Mermaid is
            // updating after a removed course can cause its label to reflow incorrectly.
            const graphBounds = graph.getBoundingClientRect();
            const naturalWidth = graphBounds.width / currentGraphZoom;
            const naturalHeight = graphBounds.height / currentGraphZoom;
            const availableWidth = viewport.clientWidth - 56;   // 56px = breathing room on each side
            const availableHeight = viewport.clientHeight - 56;

            if (!naturalWidth || !naturalHeight || availableWidth <= 0 || availableHeight <= 0) {
                return null;
            }
            return { wrapper, viewport, naturalWidth, naturalHeight, availableWidth, availableHeight };
        }

        // ROOT-TOP FIT: prefer readable course labels over squeezing an entire large
        // program onto one screen. Charts that need more reduction than this floor stay
        // at a usable size; students can use the built-in pan/scroll controls to explore
        // the outer courses.
        const FULL_GRAPH_READABLE_ZOOM = 0.58;

        function fitFullGraphToViewport() {
            const m = measureGraphAndViewport();
            if (!m) { applyGraphZoom(); return; }

            const fitScale = Math.min(m.availableWidth / m.naturalWidth, m.availableHeight / m.naturalHeight, 1);
            currentGraphZoom = Math.max(ZOOM_MIN, FULL_GRAPH_READABLE_ZOOM, +fitScale.toFixed(2));
            applyGraphZoom();
            m.viewport.scrollTop = 0;
            m.viewport.scrollLeft = 0;
        }

        // ROOT-CENTER FIT: shrinking a large radial tree down until every branch fits
        // on screen (the Root-Top strategy above) can push small print past the point of
        // being readable once a major has 20-30+ courses. Root-Center instead holds zoom
        // at a fixed legible floor (RADIAL_READABLE_ZOOM) - or a gentler fit if the graph
        // is small enough to need less shrinking than that - and centers the viewport on
        // the middle of the canvas. Because the major-title root node is always placed at
        // the exact geometric center of the radial canvas (see renderRadialLayout), that
        // also means centering the root itself. Outer branches may fall outside the
        // visible area at this zoom; the student can pan/scroll out to reach them.
        const RADIAL_READABLE_ZOOM = 0.67;

        function fitRadialGraphToViewport() {
            const m = measureGraphAndViewport();
            if (!m) { applyGraphZoom(); return; }

            const naturalFitScale = Math.min(m.availableWidth / m.naturalWidth, m.availableHeight / m.naturalHeight, 1);
            const targetScale = Math.min(ZOOM_MAX, Math.max(naturalFitScale, RADIAL_READABLE_ZOOM));
            currentGraphZoom = Math.max(ZOOM_MIN, +targetScale.toFixed(2));
            applyGraphZoom();

            // Center the scroll position on the middle of the scaled content (= the root
            // node) rather than resetting to the top-left corner used by the full-fit above.
            const scaledWidth = m.naturalWidth * currentGraphZoom;
            const scaledHeight = m.naturalHeight * currentGraphZoom;
            m.viewport.scrollLeft = Math.max(0, (scaledWidth - m.viewport.clientWidth) / 2);
            m.viewport.scrollTop = Math.max(0, (scaledHeight - m.viewport.clientHeight) / 2);
        }

        // Dispatches the "Fit" button/auto-fit-on-render to whichever strategy matches
        // the currently active layout.
        function fitGraphToViewport() {
            if (currentLayoutMode === 'root-center') {
                fitRadialGraphToViewport();
            } else {
                fitFullGraphToViewport();
            }
        }

        // Refit an open graph after the available screen area changes. Debouncing
        // avoids repeated recalculation while a user is dragging a window edge.
        let resizeFitTimer;
        window.addEventListener('resize', () => {
            syncAppLayoutOffset();
            clearTimeout(resizeFitTimer);
            resizeFitTimer = setTimeout(() => {
                if (currentSelectionMode !== 'HOME') fitGraphToViewport();
            }, 120);
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => {
            currentGraphZoom = Math.min(ZOOM_MAX, +(currentGraphZoom + ZOOM_STEP).toFixed(2));
            applyGraphZoom();
        });
        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            currentGraphZoom = Math.max(ZOOM_MIN, +(currentGraphZoom - ZOOM_STEP).toFixed(2));
            applyGraphZoom();
        });
        document.getElementById('zoomFitBtn').addEventListener('click', fitGraphToViewport);
        document.getElementById('zoomResetBtn').addEventListener('click', resetGraphZoom);

        // ANTI-CLUTTER: click-and-drag panning for large graphs on desktop (touch users
        // already get native scroll-panning). Dragging never starts on top of a clickable
        // course node, so course selection isn't disrupted.
        (function enableDragToPanViewport() {
            const viewport = document.getElementById('viewport');
            if (!viewport) return;
            let isPanning = false;
            let startX = 0, startY = 0, startScrollLeft = 0, startScrollTop = 0;

            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('.node')) return; // let course clicks through untouched
                isPanning = true;
                viewport.classList.add('is-panning');
                startX = e.pageX;
                startY = e.pageY;
                startScrollLeft = viewport.scrollLeft;
                startScrollTop = viewport.scrollTop;
            });
            window.addEventListener('mouseup', () => {
                isPanning = false;
                viewport.classList.remove('is-panning');
            });
            window.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                e.preventDefault();
                viewport.scrollLeft = startScrollLeft - (e.pageX - startX);
                viewport.scrollTop = startScrollTop - (e.pageY - startY);
            });
        })();

        // =================================================================
        // EVENT WIRING
        // =================================================================
        const filterSelect = document.getElementById('categoryFilter');
        filterSelect.addEventListener('change', (e) => {
            updateView(e.target.value);
        });

        // LAYOUT SELECTOR wiring: switch between Root-Top (top-down) and Root-Center
        // (radial, major in the middle) and redraw the current selection in that layout.
        document.getElementById('layoutModeFilter').addEventListener('change', async (e) => {
            currentLayoutMode = e.target.value;
            if (currentSelectionMode !== 'HOME' && window.triggerReRender) {
                pendingAutoFitZoom = true; // the new layout has very different proportions - refit it
                await window.triggerReRender();
            }
        });

        document.getElementById('courseSearchBtn').addEventListener('click', handleCourseSearchExecution);
        document.getElementById('courseSearchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleCourseSearchExecution();
        });

        document.getElementById('clearAllBtn').addEventListener('click', handleClearAllSelections);
        document.getElementById('transcriptFileInput').addEventListener('change', handleTranscriptUpload);

        // DOUBLE MAJOR wiring: "+" reveals the second-major picker; choosing an option
        // adds it; "x" removes it again.
        document.getElementById('addMajorBtn').addEventListener('click', () => {
            const wrapper = document.getElementById('secondMajorWrapper');
            wrapper.style.display = wrapper.style.display === 'none' ? 'flex' : 'none';
        });
        document.getElementById('secondMajorFilter').addEventListener('change', (e) => {
            if (e.target.value) {
                addSecondMajor(e.target.value);
            }
        });
        document.getElementById('removeSecondMajorBtn').addEventListener('click', removeSecondMajor);

        // RECOMMENDER wiring
        document.getElementById('recommendBtn').addEventListener('click', showRecommendationPanel);
        document.getElementById('buildDegreePlanBtn').addEventListener('click', buildDegreePlan);
        document.getElementById('closeRecommendBtn').addEventListener('click', hideRecommendationPanel);
        document.getElementById('recommendOverlay').addEventListener('click', (e) => {
            // Clicking the dimmed backdrop (not the modal itself) closes the panel
            if (e.target.id === 'recommendOverlay') hideRecommendationPanel();
        });

        // Self-directed planner wiring
        document.getElementById('closePlannerBtn').addEventListener('click', closeManualPlanner);
        document.getElementById('plannerOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'plannerOverlay') closeManualPlanner();
        });
        document.getElementById('plannerCourseSearch').addEventListener('input', renderPlannerSearch);
        ['plannerTermCount', 'plannerCoursesPerTerm', 'plannerStartTerm'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                resetManualPlan();
                renderManualPlan();
            });
        });
        document.getElementById('plannerCourseResults').addEventListener('click', (e) => {
            const result = e.target.closest('.planner-search-result');
            if (result) addCourseToManualPlan(result.dataset.course);
        });
        document.getElementById('plannerTerms').addEventListener('click', (e) => {
            const remove = e.target.closest('.planner-remove-course');
            const slot = e.target.closest('[data-term][data-slot]');
            if (!slot) return;
            const termIndex = Number(slot.dataset.term);
            const slotIndex = Number(slot.dataset.slot);
            if (remove) {
                manualPlan[termIndex][slotIndex] = null;
                selectedPlanSlot = `${termIndex}-${slotIndex}`;
            } else {
                selectedPlanSlot = `${termIndex}-${slotIndex}`;
            }
            renderManualPlan();
            renderPlannerSearch();
        });
        document.getElementById('graph-container').addEventListener('click', (e) => {
            if (e.target.closest('#manualPlanBtn')) openManualPlanner();
        });

        // =================================================================
        // NEW FEATURE WIRING: DARK MODE & MENU TOGGLE
        // =================================================================
        document.getElementById('darkModeBtn').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('darkModeBtn').textContent = isDark ? 'Light Mode' : 'Dark Mode';
        });

        document.getElementById('toggleMenuBtn').addEventListener('click', () => {
            const menu = document.getElementById('collapsibleMenu');
            const btn = document.getElementById('toggleMenuBtn');
            if (menu.style.display === 'none') {
                menu.style.display = 'flex';
                btn.textContent = 'Collapse Menu';
            } else {
                menu.style.display = 'none';
                btn.textContent = 'Expand Menu';
            }
            // Trigger layout recalculation immediately so the graph layout fits perfectly under the controls.
            setTimeout(syncAppLayoutOffset, 50); 
        });

        (async () => {
            await initializeApp();
            updateView('HOME');
        })();

    </script>
</body>
</html>
